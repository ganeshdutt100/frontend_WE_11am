<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .box {
        margin: 20px;
        width: 300px;
        height: 300px;
        background-image: url(../views/view-3d-practicing-lawyer.jpg);
        background-size: cover;
      }
      .subBox {
        width: 300px;
        height: 300px;
        background-color: rgb(0, 0, 0);
        opacity: 0.7;
      }
      .box:hover .subBox {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="subBox"></div>
    </div>
  </body>
</html>
