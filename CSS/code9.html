<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .box {
        width: 300px;
        height: 300px;
        background-color: red;
        background-image: url("https://plus.unsplash.com/premium_photo-1720287601920-ee8c503af775?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NXx8Y29kaW5nfGVufDB8fDB8fHww");
        transition: all 0.5s linear;
        position: relative;
        overflow: hidden;
      }
      p {
        width: 100%;
        height: 100%;
        font-size: 20px;
        backdrop-filter: blur(30px);
        position: absolute;
        top: 100%;

        transition: all 0.5s linear;
      }
      .box:hover p {
        top: 0;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <p>
        Lorem ipsum dolor, sit amet consectetur adipisicing elit. Necessitatibus
        animi nihil corrupti officiis reiciendis consequatur itaque ut maiores
        placeat, iste molestiae suscipit. Asperiores labore vel nobis numquam ea
        at quibusdam.
      </p>
    </div>
  </body>
</html>
