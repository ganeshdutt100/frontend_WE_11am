<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      p {
        background-color: rgb(7, 7, 28);
        color: white;
        /* display: inline; */
        display: none;
        height: 100px;
        width: 100px;
      }
      span {
        background-color: rgb(7, 7, 28);
        color: white;
        height: 100px;
        width: 100px;
        display: inline-block;

        /* display: block; */
      }
    </style>
  </head>
  <body>
    <p>This is a simple paragraph.</p>
    <p>This is a simple paragraph.</p>

    <span>This is a simple paragraph.</span>
    <span>This is a simple paragraph.</span>
  </body>
</html>
