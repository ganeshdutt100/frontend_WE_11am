<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
      .box {
        width: 200px;
        height: 200px;
        background-color: red;
        transition: all 0.5s linear;
        /* transform-origin: top right; */
        overflow: hidden;
      }
      .box:hover {
        border-radius: 50%;
        /* transform: translateX(170px);
        transform: translateY(170px);
        transform: translate(170px, 120px); */

        /* transform: rotate(320deg); */
        /* transform: scale(1.5); */
        transform: skewY(220deg);
      }
      img {
        width: 100%;
        height: 100%;
        transition: all 0.5s linear;
      }
      .box:hover img {
        transform: scale(1.3);
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/views/view-3d-practicing-lawyer.jpg" alt="" />
    </div>
  </body>
</html>
